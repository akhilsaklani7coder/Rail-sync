version: '3.8'

services:
  # MySQL Database Service (InnoDB storage engine, ACID compliant)
  db:
    image: mysql:8.4
    container_name: railsync-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-railsync_db}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed_data.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - railsync-network

  # Python Flask REST API Backend + C++ Dijkstra Route Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railsync-backend
    restart: unless-stopped
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DB_NAME=${DB_NAME:-railsync_db}
      - SECRET_KEY=${SECRET_KEY:-railsync_production_secret_key_entropy_2026}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-railsync_jwt_production_secret_key_2026}
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "5001:5001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:5001/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - railsync-network

  # React + Vite Production Frontend (Served via high-performance Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railsync-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - railsync-network

volumes:
  mysql_data:
    driver: local

networks:
  railsync-network:
    driver: bridge
